services:
  app:
    build: .
    volumes:
      - .:/var/www

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: virtualqueue
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
